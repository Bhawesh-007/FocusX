services:
  db:
    image: postgres:18
    container_name: focus_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: focus
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 uses PGDATA=/var/lib/postgresql/18/docker, so mount the
      # parent directory (not /var/lib/postgresql/data).
      - focus-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d focus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  focus-pg-data:
    name: focus-pg-data
